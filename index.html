<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Perpustakaan</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: #ffffff10;
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

h1 {
    text-align: center;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    background: #00c6ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0072ff;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    text-align: center;
}

th {
    background: #0072ff;
}

tr:nth-child(even) {
    background: #ffffff20;
}

.total {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    text-align: right;
}
</style>
</head>

<body>

<div class="container">
<h1>📚 Aplikasi Perpustakaan</h1>

<input type="text" id="nama" placeholder="Nama">
<input type="text" id="nim" placeholder="NIM">
<input type="text" id="jurusan" placeholder="Jurusan">

<select id="status">
    <option value="Pinjam">Pinjam Buku</option>
    <option value="Kembali">Pengembalian Buku</option>
    <option value="Hilang">Buku Hilang</option>
</select>

<button onclick="tambahData()">Tambah Data</button>

<table>
<thead>
<tr>
<th>Nama</th>
<th>NIM</th>
<th>Jurusan</th>
<th>Status</th>
<th>Denda</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelData"></tbody>
</table>

<div class="total">Total Denda: Rp <span id="totalDenda">0</span></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("perpus")) || [];

function render() {
    let tabel = document.getElementById("tabelData");
    tabel.innerHTML = "";
    let total = 0;

    data.forEach((item, index) => {
        total += item.denda;

        tabel.innerHTML += `
        <tr>
            <td>${item.nama}</td>
            <td>${item.nim}</td>
            <td>${item.jurusan}</td>
            <td>${item.status}</td>
            <td>Rp ${item.denda}</td>
            <td><button onclick="hapus(${index})">Hapus</button></td>
        </tr>
        `;
    });

    document.getElementById("totalDenda").innerText = total;
    localStorage.setItem("perpus", JSON.stringify(data));
}

function tambahData() {
    let nama = document.getElementById("nama").value;
    let nim = document.getElementById("nim").value;
    let jurusan = document.getElementById("jurusan").value;
    let status = document.getElementById("status").value;

    let denda = 0;

    if (status === "Hilang") {
        denda = 50000; // denda tetap
    }

    if (!nama || !nim || !jurusan) {
        alert("Isi semua data!");
        return;
    }

    data.push({ nama, nim, jurusan, status, denda });

    document.getElementById("nama").value = "";
    document.getElementById("nim").value = "";
    document.getElementById("jurusan").value = "";

    render();
}

function hapus(index) {
    data.splice(index, 1);
    render();
}

render();
</script>

</body>
</html>
