<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Smart Student App</title>

<style>
:root {
  --primary: #4f46e5;
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #333;
}

body.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #fff;
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 550px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: var(--card);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  margin-bottom: 20px;
}

h1 {
  text-align: center;
}

input {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  padding: 10px 15px;
  border: none;
  background: var(--primary);
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.flex {
  display: flex;
  gap: 10px;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: #eee;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
}

.done {
  text-decoration: line-through;
  opacity: 0.6;
}

.hidden {
  display: none;
}

.filter button {
  background: #64748b;
}

.profile {
  font-size: 14px;
}

.qr-preview {
  width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}
</style>

</head>
<body>

<div class="container">

<h1>🚀 Smart Student App</h1>

<!-- LOGIN -->
<div id="loginBox" class="card">
  <input id="usernameInput" placeholder="Nama">
  <input id="nimInput" placeholder="NIM">
  <input id="jurusanInput" placeholder="Jurusan">
  <button onclick="login()">Masuk</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- PROFILE -->
  <div class="card profile">
    👤 <b id="showUser"></b><br>
    🎓 NIM: <span id="showNim"></span><br>
    📚 Jurusan: <span id="showJurusan"></span><br><br>
    <button onclick="toggleDark()">🌙 Dark Mode</button>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- TODO -->
  <div class="card">
    <h3>📝 ToDo</h3>

    <div class="flex">
      <input id="taskInput" placeholder="Tambah tugas...">
      <button onclick="addTask()">+</button>
    </div>

    <div class="filter">
      <button onclick="setFilter('all')">All</button>
      <button onclick="setFilter('done')">Done</button>
      <button onclick="setFilter('pending')">Pending</button>
    </div>

    <ul id="taskList"></ul>
    <p id="aiText"></p>
  </div>

  <!-- ABSENSI QR -->
  <div class="card">
    <h3>📸 Absensi QR</h3>
    <input type="file" accept="image/*" onchange="scanQR(event)">
    <img id="qrPreview" class="qr-preview hidden">
    <p id="qrResult"></p>
  </div>

</div>

</div>

<script>
let currentUser = null;
let tasks = [];
let filter = "all";

// LOGIN
function login() {
  const username = usernameInput.value;
  const nim = nimInput.value;
  const jurusan = jurusanInput.value;

  if (!username || !nim || !jurusan) {
    alert("Lengkapi semua data!");
    return;
  }

  currentUser = { username, nim, jurusan };
  localStorage.setItem("currentUser", JSON.stringify(currentUser));

  loginBox.classList.add("hidden");
  app.classList.remove("hidden");

  loadUser();
  loadTasks();
}

// LOAD USER
function loadUser() {
  const user = JSON.parse(localStorage.getItem("currentUser"));
  if (!user) return;

  currentUser = user;

  showUser.innerText = user.username;
  showNim.innerText = user.nim;
  showJurusan.innerText = user.jurusan;
}

// KEY PER USER
function getUserKey() {
  return "tasks_" + currentUser.nim;
}

// LOAD TASK
function loadTasks() {
  tasks = JSON.parse(localStorage.getItem(getUserKey())) || [];
  render();
}

// ADD TASK
function addTask() {
  if (!taskInput.value) return;

  tasks.push({
    id: Date.now(),
    text: taskInput.value,
    done: false
  });

  save();
  taskInput.value = "";
  render();
}

// TOGGLE
function toggleTask(id) {
  tasks = tasks.map(t =>
    t.id === id ? { ...t, done: !t.done } : t
  );
  save();
  render();
}

// DELETE
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save();
  render();
}

// FILTER
function setFilter(f) {
  filter = f;
  render();
}

// RENDER
function render() {
  taskList.innerHTML = "";

  let data = tasks;
  if (filter === "done") data = tasks.filter(t => t.done);
  if (filter === "pending") data = tasks.filter(t => !t.done);

  data.forEach(t => {
    taskList.innerHTML += `
      <li class="${t.done ? 'done':''}">
        <span onclick="toggleTask(${t.id})">${t.text}</span>
        <button onclick="deleteTask(${t.id})">❌</button>
      </li>
    `;
  });

  aiReminder();
}

// SAVE
function save() {
  localStorage.setItem(getUserKey(), JSON.stringify(tasks));
}

// AI REMINDER
function aiReminder() {
  const pending = tasks.filter(t => !t.done).length;

  aiText.innerText =
    pending === 0 ? "🔥 Semua tugas selesai!"
    : pending <= 2 ? "👍 Hampir selesai!"
    : "⚠️ Banyak tugas, ayo kerjakan!";
}

// DARK MODE
function toggleDark() {
  document.body.classList.toggle("dark");
}

// LOGOUT
function logout() {
  localStorage.removeItem("currentUser");
  location.reload();
}

// QR ABSENSI (SIMULASI)
function scanQR(event) {
  const file = event.target.files[0];
  if (!file) return;

  qrPreview.src = URL.createObjectURL(file);
  qrPreview.classList.remove("hidden");

  setTimeout(() => {
    qrResult.innerText = "✅ Absensi berhasil (QR terdeteksi)";
  }, 1000);
}

// AUTO LOGIN
window.onload = () => {
  const user = localStorage.getItem("currentUser");

  if (user) {
    loginBox.classList.add("hidden");
    app.classList.remove("hidden");

    loadUser();
    loadTasks();
  }
};
</script>

</body>
</html>
