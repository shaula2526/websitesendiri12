<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perpustakaan Super Premium</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: #ffffff10;
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(12px);
}

h1 {
    text-align: center;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
}

button {
    background: #00c6ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0072ff;
}

table {
    width: 100%;
    margin-top: 15px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    text-align: center;
}

th {
    background: #0072ff;
}

tr:nth-child(even) {
    background: #ffffff20;
}

.total {
    margin-top: 15px;
    text-align: right;
    font-weight: bold;
}

/* login */
.login {
    max-width: 400px;
    margin: auto;
    margin-top: 100px;
    background: #ffffff10;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
<h2>🔐 Login Admin</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">
<h1>📚 Sistem Perpustakaan</h1>

<input type="text" id="nama" placeholder="Nama">
<input type="text" id="nim" placeholder="NIM">
<input type="text" id="jurusan" placeholder="Jurusan">
<input type="text" id="buku" placeholder="Nama Buku">

<select id="status">
<option value="Pinjam">Pinjam</option>
<option value="Kembali">Kembali</option>
<option value="Hilang">Hilang</option>
</select>

<button onclick="tambahData()">Tambah / Update</button>

<input type="text" id="search" placeholder="🔍 Cari..." onkeyup="render()">

<table>
<thead>
<tr>
<th>Nama</th>
<th>NIM</th>
<th>Jurusan</th>
<th>Buku</th>
<th>Status</th>
<th>Denda</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabelData"></tbody>
</table>

<div class="total">Total Denda: Rp <span id="totalDenda">0</span></div>

<canvas id="chart" height="100"></canvas>

</div>

<script>
let data = JSON.parse(localStorage.getItem("perpus")) || [];
let editIndex = null;

/* LOGIN */
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "admin" && pass === "123") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else {
        alert("Login gagal!");
    }
}

/* TAMBAH / EDIT */
function tambahData() {
    let nama = document.getElementById("nama").value;
    let nim = document.getElementById("nim").value;
    let jurusan = document.getElementById("jurusan").value;
    let buku = document.getElementById("buku").value;
    let status = document.getElementById("status").value;

    let denda = status === "Hilang" ? 50000 : 0;

    if (!nama || !nim || !jurusan || !buku) {
        alert("Isi semua data!");
        return;
    }

    let obj = { nama, nim, jurusan, buku, status, denda };

    if (editIndex !== null) {
        data[editIndex] = obj;
        editIndex = null;
    } else {
        data.push(obj);
    }

    clearForm();
    render();
}

function edit(i) {
    let item = data[i];
    document.getElementById("nama").value = item.nama;
    document.getElementById("nim").value = item.nim;
    document.getElementById("jurusan").value = item.jurusan;
    document.getElementById("buku").value = item.buku;
    document.getElementById("status").value = item.status;

    editIndex = i;
}

function hapus(i) {
    data.splice(i, 1);
    render();
}

function clearForm() {
    document.getElementById("nama").value = "";
    document.getElementById("nim").value = "";
    document.getElementById("jurusan").value = "";
    document.getElementById("buku").value = "";
}

/* RENDER */
function render() {
    let tabel = document.getElementById("tabelData");
    let keyword = document.getElementById("search").value.toLowerCase();

    tabel.innerHTML = "";
    let total = 0;

    let filtered = data.filter(item =>
        item.nama.toLowerCase().includes(keyword) ||
        item.nim.toLowerCase().includes(keyword) ||
        item.buku.toLowerCase().includes(keyword)
    );

    filtered.forEach((item, i) => {
        total += item.denda;

        tabel.innerHTML += `
        <tr>
        <td>${item.nama}</td>
        <td>${item.nim}</td>
        <td>${item.jurusan}</td>
        <td>${item.buku}</td>
        <td>${item.status}</td>
        <td>Rp ${item.denda}</td>
        <td>
            <button onclick="edit(${i})">Edit</button>
            <button onclick="hapus(${i})">Hapus</button>
        </td>
        </tr>`;
    });

    document.getElementById("totalDenda").innerText = total;

    localStorage.setItem("perpus", JSON.stringify(data));

    updateChart();
}

/* CHART */
let chart;

function updateChart() {
    let pinjam = data.filter(d => d.status === "Pinjam").length;
    let kembali = data.filter(d => d.status === "Kembali").length;
    let hilang = data.filter(d => d.status === "Hilang").length;

    let ctx = document.getElementById("chart").getContext("2d");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Pinjam', 'Kembali', 'Hilang'],
            datasets: [{
                label: 'Statistik Buku',
                data: [pinjam, kembali, hilang]
            }]
        }
    });
}

render();
</script>

</body>
</html>
